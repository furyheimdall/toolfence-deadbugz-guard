<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Deadbugz guard flow - Agent to guard to MCP server, then allow or deny</title>
  <desc id="desc">The agent asks Deadbugz guard for the tool menu. The guard asks the MCP server, compares the live tools/list to the approved pin, then allows a match (including reorder-only) or denies a mismatch until a human re-approves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="url(#bg)"/>
  <text x="48" y="48" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Deadbugz guard</text>
  <text x="48" y="74" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">a lock on the tool menu: pin then tools/list diff then fail-closed</text>
  <text x="912" y="48" text-anchor="end" fill="#6e7681" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">OSS self-host sidecar</text>

  <!-- path: Agent - guard - MCP -->
  <rect x="48" y="108" width="220" height="88" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="158" y="146" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Agent / host</text>
  <text x="158" y="170" text-anchor="middle" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Cursor, etc.</text>

  <line x1="268" y1="152" x2="318" y2="152" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="100" width="320" height="104" rx="12" fill="#161b22" stroke="#58a6ff"/>
  <text x="480" y="138" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">sidecar on the existing MCP path</text>
  <text x="480" y="166" text-anchor="middle" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Deadbugz guard</text>
  <text x="480" y="188" text-anchor="middle" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">compares live tools/list to pin</text>

  <line x1="640" y1="152" x2="690" y2="152" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="692" y="108" width="220" height="88" rx="12" fill="#21262d" stroke="#30363d"/>
  <text x="802" y="146" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">MCP server</text>
  <text x="802" y="170" text-anchor="middle" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Filesystem, ...</text>

  <!-- decision -->
  <line x1="480" y1="204" x2="480" y2="236" stroke="#8b949e" stroke-width="2"/>
  <rect x="300" y="236" width="360" height="56" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="480" y="258" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">approved pin</text>
  <text x="480" y="278" text-anchor="middle" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">does the live menu match?</text>

  <!-- ALLOW -->
  <path d="M360 292 L200 330" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow-ok)"/>
  <g transform="translate(48,336)">
    <rect width="400" height="176" rx="14" fill="#0d1117" stroke="#238636"/>
    <text x="24" y="36" fill="#3fb950" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">match or reorder-only</text>
    <text x="24" y="68" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Same approved tools. Order may change.</text>
    <rect x="56" y="88" width="288" height="64" rx="10" fill="#122117" stroke="#3fb950"/>
    <text x="200" y="116" text-anchor="middle" fill="#3fb950" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">ALLOW</text>
    <text x="200" y="138" text-anchor="middle" fill="#7ee787" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">listing reaches the agent</text>
  </g>

  <!-- DENY -->
  <path d="M600 292 L760 330" stroke="#da3633" stroke-width="2" fill="none" marker-end="url(#arrow-no)"/>
  <g transform="translate(512,336)">
    <rect width="400" height="176" rx="14" fill="#0d1117" stroke="#da3633"/>
    <text x="24" y="36" fill="#f85149" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">mismatch (poison / add / remove)</text>
    <text x="24" y="68" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Menu changed. Stay shut until re-approve.</text>
    <rect x="56" y="88" width="288" height="64" rx="10" fill="#2d1113" stroke="#f85149"/>
    <text x="200" y="116" text-anchor="middle" fill="#f85149" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">DENY</text>
    <text x="200" y="138" text-anchor="middle" fill="#ff7b72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">fail-closed - re-approve to pin</text>
  </g>
</svg>
