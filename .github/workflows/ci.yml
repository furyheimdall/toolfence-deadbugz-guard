name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: smoke
        run: ./scripts/smoke.sh

  # E3 (#23): Filesystem + Fetch wrap + non-TTY pin. Headless, no TTY.
  # E1 seam (#23): sibling job verify-github-toolsets for official MCP
  # toolsets / config_or_inventory_changed (#21). Do not fold toolsets
  # into verify-filesystem-fetch.sh.
  verify-filesystem-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - name: verify Filesystem + Fetch wrap (non-TTY pin)
        run: ./scripts/verify-filesystem-fetch.sh --ci

  # E1 (#23): GitHub official MCP toolsets / config_or_inventory_changed.
  # Sibling of verify-filesystem-fetch. No GitHub credentials (mock fixture).
  verify-github-toolsets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: github toolsets inventory-change
        run: ./scripts/verify-github-toolsets.sh
