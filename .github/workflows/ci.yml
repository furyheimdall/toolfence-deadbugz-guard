name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: smoke
        run: ./scripts/smoke.sh

  # E3 (#23): Filesystem + Fetch wrap + non-TTY pin. Headless, no TTY.
  # E1 seam (#23): add a separate job after this one for GitHub official MCP
  # toolsets / intentional inventory change → config_or_inventory_changed
  # (#21). Do not fold toolsets into verify-filesystem-fetch.sh.
  verify-filesystem-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - name: verify Filesystem + Fetch wrap (non-TTY pin)
        run: ./scripts/verify-filesystem-fetch.sh --ci
